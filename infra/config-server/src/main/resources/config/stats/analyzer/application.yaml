spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      user-action:
        group-id: analyzer-consumer-user-action-group
      event-similarity:
        group-id: analyzer-consumer-event-similarity-group
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Moscow
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/statistics
    username: statistics
    password: statistics

kafka:
  topics:
    event-similarity: stats.events-similarity.v1
    user-action: stats.user-actions.v1

grpc:
  server:
    port: 0

